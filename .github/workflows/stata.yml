name: Stata

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  stata-lint:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Lint
        shell: bash
        run: make -C stata lint

  stata-test:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Certify
        shell: bash
        run: make -C stata test
